# Isolated HTTP ingress; same Nginx version, body/rate/connection limits and
# forwarded-header policy as production. TLS termination is outside this local test.
limit_req_zone $binary_remote_addr zone=usage:10m rate=2r/s;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=connections:10m;
server {
  listen 8080;
  access_log off;
  error_log /dev/stderr crit;
  client_max_body_size 1m;
  client_body_timeout 20s;
  limit_conn connections 20;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Request-ID $request_id;
  proxy_http_version 1.1;
  proxy_connect_timeout 5s;
  proxy_read_timeout 100s;
  proxy_buffering off;
  location / { proxy_pass http://phase2e-app:3000; }
  location = /api/dashboard/usage { limit_req zone=usage burst=5 nodelay; proxy_pass http://phase2e-app:3000; }
  location = /api/dashboard/imports/preview { client_max_body_size 64m; proxy_pass http://phase2e-app:3000; }
}

name: incept
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${INCEPT_DATABASE_NAME:-incept}
      POSTGRES_USER: incept_migrator
      POSTGRES_PASSWORD: ${MIGRATION_DB_PASSWORD:?Configure migration password}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Configure application password}
    command:
      - postgres
      - -c
      - max_connections=20
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=2MB
      - -c
      - hash_mem_multiplier=1
      - -c
      - maintenance_work_mem=32MB
      - -c
      - autovacuum_work_mem=16MB
      - -c
      - autovacuum_max_workers=1
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - max_parallel_maintenance_workers=0
      - -c
      - max_parallel_workers=0
      - -c
      - effective_cache_size=128MB
      - -c
      - jit=off
      - -c
      - min_wal_size=64MB
      - -c
      - max_wal_size=256MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-incept.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incept_migrator -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m
    memswap_limit: 384m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  migrate:
    image: ${INCEPT_APP_IMAGE:?Configure release image}
    profiles: [ops]
    entrypoint: ["pnpm", "db:deploy"]
    environment:
      DATABASE_URL: postgresql://incept_migrator:${MIGRATION_DB_PASSWORD:?Configure migration password}@postgres:5432/${INCEPT_DATABASE_NAME:-incept}
      NODE_OPTIONS: "--max-old-space-size=128 --max-semi-space-size=8"
    mem_limit: 320m
    memswap_limit: 320m
    depends_on:
      postgres: { condition: service_healthy }
  app:
    image: ${INCEPT_APP_IMAGE:?Configure release image}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      DATABASE_URL: postgresql://incept_app:${APP_DB_PASSWORD:?Configure application password}@postgres:5432/${INCEPT_DATABASE_NAME:-incept}?connection_limit=5&pool_timeout=10&connect_timeout=5
      INCEPT_AUTH_ENCRYPTION_KEY: ${INCEPT_AUTH_ENCRYPTION_KEY:?Configure Owner TOTP encryption key}
      NODE_OPTIONS: "--max-old-space-size=256 --max-semi-space-size=8"
      INCEPT_TRUST_PROXY: "1"
      INCEPT_DOCS_MEDIA_DIR: /data/docs-media
      INCEPT_DOCS_DRAFTS_DIR: /data/docs-drafts
      INCEPT_MUSIC_MEDIA_DIR: /data/music-media
      INCEPT_DASHBOARD_HOME: /data/dashboard
      INCEPT_DASHBOARD_IMPORTS_FILE: /data/dashboard/imports.db
      INCEPT_DASHBOARD_CACHE_FILE: /data/dashboard/snapshots.json
      INCEPT_DASHBOARD_OVERRIDES_FILE: /data/dashboard/overrides.json
      INCEPT_SYNC_ENABLED: ${INCEPT_SYNC_ENABLED:-0}
      INCEPT_SYNC_REMOTE_ENABLED: ${INCEPT_SYNC_REMOTE_ENABLED:-0}
      INCEPT_SYNC_READ_MODE: ${INCEPT_SYNC_READ_MODE:-v1}
      INCEPT_SYNC_DATABASE_FILE: ${INCEPT_SYNC_DATABASE_FILE:-/data/sync/v2.db}
      INCEPT_SYNC_RPC_KEY_FILE: /run/incept-secrets/sync-rpc.key
      INCEPT_SYNC_GATEWAY_INTERNAL_URL: http://sync-gateway:3101
      INCEPT_SYNC_DEVICE_ALLOWLIST: ${INCEPT_SYNC_DEVICE_ALLOWLIST:-}
      INCEPT_SYNC_POLL_MS: ${INCEPT_SYNC_POLL_MS:-300000}
      INCEPT_SYNC_MAX_QUEUE: '4'
      INCEPT_SYNC_MAX_BATCH_RECORDS: '20000'
      INCEPT_SYNC_MEMORY_PERCENT: '85'
      INCEPT_SYNC_WARN_BYTES: '1073741824'
      INCEPT_SYNC_REVIEW_BYTES: '2147483648'
      INCEPT_SYNC_MAX_STORE_BYTES: '4294967296'
      INCEPT_SYNC_WARN_FREE_BYTES: '5368709120'
      INCEPT_SYNC_REJECT_FREE_BYTES: '2147483648'
    volumes:
      - ${INCEPT_DATA_DIR:?Configure persistent data directory}:/data
      - ${INCEPT_SECRET_DIR:-/srv/incept/secrets}:/run/incept-secrets:ro
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777,size=64m
      - /app/apps/web/.next/cache:uid=1000,gid=1000,mode=0700,size=64m
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    cpus: 2
    mem_limit: 768m
    memswap_limit: 1024m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  sync-gateway:
    image: ${INCEPT_APP_IMAGE:?Configure release image}
    profiles: [sync]
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    entrypoint: ["node", "apps/sync-gateway/dist/gateway.mjs"]
    depends_on:
      app: { condition: service_healthy }
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=64 --max-semi-space-size=4"
      INCEPT_GATEWAY_HOST: 0.0.0.0
      INCEPT_GATEWAY_PORT: "3101"
      INCEPT_SYNC_WEB_INTERNAL_URL: http://app:3000
      INCEPT_SYNC_RPC_KEY_FILE: /run/incept-secrets/sync-rpc.key
    volumes:
      - ${INCEPT_SECRET_DIR:-/srv/incept/secrets}:/run/incept-secrets:ro
    tmpfs:
      - /tmp:size=8m,mode=1777
    expose: ["3101"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3101/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    cpus: 0.5
    mem_limit: 128m
    memswap_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  # Optional non-production proxy; production uses compose.caddy.yml + Caddyfile.
  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    environment:
      INCEPT_DOMAIN: ${INCEPT_DOMAIN:?Configure domain}
    ports:
      - "${INCEPT_HTTP_BIND:-0.0.0.0}:80:80"
      - "${INCEPT_HTTP_BIND:-0.0.0.0}:443:443"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${INCEPT_CERT_DIR:-/srv/incept/certificates}:/etc/incept/tls:ro
      - ${INCEPT_ACME_DIR:-/srv/incept/acme}:/var/www/acme:ro
    depends_on:
      app: { condition: service_healthy }
    mem_limit: 96m
    memswap_limit: 96m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  postgres_data:

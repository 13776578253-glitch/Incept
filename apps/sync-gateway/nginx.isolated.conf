map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 443 ssl;
  server_name _;
  ssl_certificate /etc/incept/tls/cert.pem;
  ssl_certificate_key /etc/incept/tls/key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  access_log off;
  error_log /var/log/nginx/error.log crit;
  client_max_body_size 1m;
  client_body_timeout 20s;
  proxy_connect_timeout 5s;
  proxy_read_timeout 100s;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto https;
  location ^~ /api/internal/sync/ { return 404; }
  location ^~ /rpc/ { return 404; }
  location = /api/sync/ws {
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 90s;
    proxy_send_timeout 20s;
    proxy_buffering off;
    proxy_pass http://gateway:3101;
  }
  location / { proxy_pass http://app:3000; }
}
